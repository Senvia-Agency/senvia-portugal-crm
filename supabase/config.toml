# Callback do OAuth da Meta — chamada pelo browser do utilizador no fim do
# diálogo de login, sem JWT nenhum.
[functions.meta-connect]
verify_jwt = false

# Envio de respostas. Exige sessão do utilizador (verificada dentro da função),
# porque o token da Página nunca pode sair do servidor.
[functions.meta-send]
verify_jwt = false

# Ficheiros recebidos pelo WhatsApp: o webhook só guarda um id, e o download
# exige o token da conta. Mesma regra do envio — sessão verificada por dentro.
[functions.meta-media]
verify_jwt = false

# Chamada pela Meta a cada mensagem recebida. Autentica-se pela assinatura
# HMAC em X-Hub-Signature-256, verificada dentro da função.
[functions.meta-webhook]
verify_jwt = false

# Chamada pela Meta, não por um utilizador nosso — não há JWT nenhum para
# validar. A autenticação é feita dentro da função, verificando a assinatura
# HMAC do signed_request com o App Secret.
[functions.meta-data-deletion]
verify_jwt = false

[functions.transcribe-audio]
verify_jwt = true

[functions.chatwoot-export]
verify_jwt = false

# O callback do OAuth é uma navegação do browser vinda do Stripe, sem cabeçalho
# Authorization — com verify_jwt ligado o Stripe apanharia 401 e a ligação nunca
# se concluía. Em troca, a função autentica ela própria as acções status,
# authorize e disconnect, e o callback é protegido pelo state de uso único.
[functions.stripe-connect]
verify_jwt = false

# Chamada pelo CRM com sessão do utilizador. A função exige is_org_admin e
# resolve a organização a partir do produto, nunca do corpo do pedido.
[functions.stripe-product-sync]
verify_jwt = true

# Chamada pelo CRM com sessao do utilizador. A organizacao vem da recorrencia,
# nunca do corpo do pedido.
[functions.stripe-sale-checkout]
verify_jwt = true

# Chamada pelo Stripe, nao por um utilizador nosso. Autentica-se pela assinatura
